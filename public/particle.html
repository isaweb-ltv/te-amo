<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Morfismo de Partículas - Regalo</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 14px 36px; font-size: clamp(16px, 4vw, 22px); background: #ff2d55; color: white;
            border: none; border-radius: 50px; cursor: pointer; z-index: 100;
            font-family: sans-serif; font-weight: bold; box-shadow: 0 0 20px #ff2d55;
            transition: 0.3s; -webkit-tap-highlight-color: transparent;
        }
        #btn:hover { background: #ff4d6d; scale: 1.05; }
        #btn:active { background: #ff4d6d; scale: 0.97; }
    </style>
</head>
<body>
    <button id="btn">❤️ INICIAR</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const btn = document.getElementById('btn');

        let particles = [];
        let mouse = { x: -1000, y: -1000, radius: 110 };
        let msgIndex = 0;
        let started = false;
        let heartMode = false;
        let heartbeatStartTime = 0;

        // Detectar movil y ajustar cantidad de particulas
        const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const PARTICLE_COUNT = isMobile ? 2500 : 5000;

        // Simula el patrón "lub-dub" de un corazón real
        function getHeartbeat(time) {
            // Ciclo de ~1 segundo (como 72 BPM)
            const cycle = (time % 1000) / 1000;
            // Primer latido (lub) - rápido y fuerte
            const lub = Math.exp(-Math.pow((cycle - 0.1) * 20, 2)) * 1.0;
            // Segundo latido (dub) - un poco más suave
            const dub = Math.exp(-Math.pow((cycle - 0.28) * 20, 2)) * 0.6;
            return lub + dub;
        }
        const messages = ["Te amo", "mi niña", "preciosa", "gracias", "por existir", "Felices 17 meses mi amor ❤"];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 150);
        });

        window.addEventListener('mousemove', e => { if (!started) { mouse.x = e.x; mouse.y = e.y; } });
        window.addEventListener('touchstart', e => { if (!started) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
        window.addEventListener('touchmove', e => { if (!started) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.baseX = this.x;
                this.baseY = this.y;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                // Estrellas: la mayoria pequenas, pocas grandes y brillantes
                const r = Math.random();
                this.starSize = r < 0.85 ? 0.5 + Math.random() * 0.8
                              : r < 0.97 ? 1.5 + Math.random() * 1.2
                              : 2.8 + Math.random() * 1.5;
                this.size = this.starSize;
                // Colores de estrellas: blancas, azuladas, amarillentas
                const colors = ['#ffffff', '#ffffff', '#ffffff', '#cad8ff', '#aabfff', '#ffe8b0', '#fff4e0', '#ffd2a1'];
                this.starColor = colors[Math.floor(Math.random() * colors.length)];
                this.color = this.starColor;
                this.friction = 0.85;
                this.ease = 0.06;
                // Parpadeo: cada estrella tiene su propio ciclo
                this.twinkleSpeed = 0.001 + Math.random() * 0.004;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.opacity = 1;
            }

            draw() {
                ctx.globalAlpha = this.opacity;
                if (!started && this.starSize > 2) {
                    // Estrellas grandes tienen resplandor
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                    glow.addColorStop(0, this.color);
                    glow.addColorStop(0.3, this.color + '66');
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            update() {
                if (!started) {
                    // MODO ESTRELLAS: flotan lentamente y parpadean
                    const now = Date.now();
                    // Parpadeo natural: oscila entre 0.2 y 1.0
                    const twinkle = Math.sin(now * this.twinkleSpeed + this.twinkleOffset);
                    this.opacity = 0.4 + 0.6 * ((twinkle + 1) / 2);
                    // Estrellas grandes parpadean menos, pequenas mas
                    if (this.starSize < 1) {
                        this.opacity *= 0.3 + 0.7 * ((Math.sin(now * this.twinkleSpeed * 2.5 + this.twinkleOffset) + 1) / 2);
                    }

                    // Repulsion del mouse
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 6;
                        this.y -= (dy / dist) * force * 6;
                    }

                    // Deriva lenta como estrellas en el espacio
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                } else {
                    // Transicion: restaurar opacidad y tamano para el texto
                    this.opacity += (1 - this.opacity) * 0.05;
                    this.size += (1.1 - this.size) * 0.05;

                    // Morfismo elastico hacia el punto objetivo
                    let dx = this.baseX - this.x;
                    let dy = this.baseY - this.y;
                    this.x += dx * this.ease;
                    this.y += dy * this.ease;
                }

                if (heartMode) {
                    // Latido realista: las partículas se expanden desde el centro del corazón
                    const beat = getHeartbeat(Date.now());
                    // Ramp-up gradual: la intensidad crece durante los primeros 3 segundos
                    const elapsed = Date.now() - heartbeatStartTime;
                    const ramp = Math.min(elapsed / 3000, 1);
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const dx = this.baseX - cx;
                    const dy = this.baseY - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        const scale = beat * 12 * ramp;
                        this.x += (dx / dist) * scale * (dist / 200);
                        this.y += (dy / dist) * scale * (dist / 200);
                    }
                }
            }
        }

        // Canvas oculto para escanear texto sin que se vea en pantalla
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function getPoints(text) {
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.fillStyle = "white";
            offCtx.textAlign = "center";
            offCtx.textBaseline = "middle";

            const maxWidth = offCanvas.width * 0.85;
            let fontSize = Math.min(offCanvas.width / 5, 130);
            offCtx.font = `bold ${fontSize}px Arial`;

            const words = text.split(' ');
            let lines = [];
            
            if (offCtx.measureText(text).width <= maxWidth) {
                lines = [text];
            } else {
                let currentLine = words[0];
                for (let i = 1; i < words.length; i++) {
                    let testLine = currentLine + ' ' + words[i];
                    if (offCtx.measureText(testLine).width > maxWidth) {
                        lines.push(currentLine);
                        currentLine = words[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                lines.push(currentLine);

                let fits = false;
                while (!fits && fontSize > 20) {
                    offCtx.font = `bold ${fontSize}px Arial`;
                    fits = lines.every(l => offCtx.measureText(l).width <= maxWidth);
                    if (!fits) fontSize -= 2;
                }
            }

            const lineHeight = fontSize * 1.25;
            const totalHeight = lines.length * lineHeight;
            const startY = offCanvas.height / 2 - totalHeight / 2 + lineHeight / 2;

            lines.forEach((line, i) => {
                offCtx.fillText(line, offCanvas.width / 2, startY + i * lineHeight);
            });

            const data = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
            
            // Recoger pixeles iluminados (step 2 para rendimiento en movil)
            const scanStep = 2;
            const allPts = [];
            for (let y = 0; y < offCanvas.height; y += scanStep) {
                for (let x = 0; x < offCanvas.width; x += scanStep) {
                    if (data[(y * offCanvas.width + x) * 4 + 3] > 128) {
                        allPts.push({x, y});
                    }
                }
            }

            // Luego tomar exactamente la cantidad de particulas que tenemos,
            // distribuidas uniformemente, para que todas las frases se vean igual de densas
            const targetCount = particles.length;
            const pts = [];
            if (allPts.length <= targetCount) {
                // Pocos pixeles: usar todos y repetir para llenar
                for (let i = 0; i < targetCount; i++) {
                    pts.push(allPts[i % allPts.length]);
                }
            } else {
                // Muchos pixeles: muestrear uniformemente
                const step = allPts.length / targetCount;
                for (let i = 0; i < targetCount; i++) {
                    pts.push(allPts[Math.floor(i * step)]);
                }
            }
            return pts;
        }

        function getHeart() {
            const pts = [];
            const scale = Math.min(canvas.width, canvas.height) / 22;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let t = Math.random() * Math.PI * 2;
                let layer = (i % 5) + 1; 
                let r = (layer * scale) / 5;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                pts.push({ x: canvas.width/2 + x*r, y: canvas.height/2 + y*r });
            }
            return pts;
        }

        function flow() {
            if (msgIndex < messages.length) {
                const pts = getPoints(messages[msgIndex]);
                particles.forEach((p, i) => {
                    let target = pts[i % pts.length];
                    p.baseX = target.x; 
                    p.baseY = target.y;
                    p.color = '#ff2d55';
                    p.ease = 0.04; // Transición entre palabras más suave
                });
                msgIndex++;
                setTimeout(flow, 3200); // Más tiempo para leer y ver el movimiento
            } else {
                // Primero: formar el corazón sin latido
                const pts = getHeart();
                particles.forEach((p, i) => {
                    let target = pts[i % pts.length];
                    p.baseX = target.x; 
                    p.baseY = target.y;
                    p.color = i % 2 === 0 ? '#ff0040' : '#ff758f';
                    p.ease = 0.02;
                });
                // Luego: esperar a que las partículas se asienten y activar el latido
                setTimeout(() => {
                    heartMode = true;
                    heartbeatStartTime = Date.now();
                }, 3000);
            }
        }

        function init() {
            for(let i=0; i<PARTICLE_COUNT; i++) particles.push(new Particle());
            function loop() {
                // Fondo negro solido para estrellas limpias; trail suave para texto
                ctx.fillStyle = started ? 'rgba(0,0,0,0.15)' : 'rgba(0,0,0,1)';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(loop);
            }
            loop();
        }

        btn.onclick = () => { 
            started = true;
            mouse.x = -1000;
            mouse.y = -1000;
            btn.style.display='none'; 
            flow(); 
        };
        init();
    </script>
</body>
</html>
